name: Deploy playable tasks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'native-city/**'
      - 'assets/**'
      - 'city/**'
      - 'characters/**'
      - 'tasks/**'
      - 'training-tasks/outdoor-walk/**'
      - 'licenses/**'
      - 'configs/task-categories.json'
      - 'scripts/build-site.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
      - name: Package the game and 150 task links
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/build-site.mjs --base-url "$SITE_URL"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
